name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  tests:
    name: Tests (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Run tests in parallel
        run: composer test

  lint:
    name: Lint (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none

      - name: Validate root Composer configuration
        run: composer config:validate

      - name: Validate package Composer configurations
        run: composer packages:validate

      - name: Audit dependencies
        run: composer security:audit

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Check coding style
        run: composer format:check

      - name: Run PHPStan and php-ai-toolkit rules
        run: composer phpstan

      - name: Check source metrics
        run: composer loc-guard

      - name: Check architecture dependencies
        run: composer deptrac
