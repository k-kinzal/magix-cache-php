deptrac:
  paths:
    - ./packages/magix-cache/src
    - ./packages/magix-cache-laravel/src
    - ./packages/magix-cache-symfony/src
    - ./packages/magix-cache-cli/src
  exclude_files: []
  layers:
    - name: CoreApi
      collectors:
        - type: directory
          value: packages/magix-cache/src/[^/]+\.php
    - name: Attribute
      collectors:
        - type: directory
          value: packages/magix-cache/src/Attribute/.*
    - name: Metadata
      collectors:
        - type: directory
          value: packages/magix-cache/src/Metadata/.*
    - name: Composition
      collectors:
        - type: directory
          value: packages/magix-cache/src/Composition/.*
    - name: Runtime
      collectors:
        - type: directory
          value: packages/magix-cache/src/Runtime/.*
    - name: Strategy
      collectors:
        - type: directory
          value: packages/magix-cache/src/Strategy/.*
    - name: Cache
      collectors:
        - type: directory
          value: packages/magix-cache/src/Cache/.*
    - name: Clock
      collectors:
        - type: directory
          value: packages/magix-cache/src/Clock/.*
    - name: Laravel
      collectors:
        - type: directory
          value: packages/magix-cache-laravel/src/.*
    - name: Symfony
      collectors:
        - type: directory
          value: packages/magix-cache-symfony/src/.*
    - name: CliConsole
      collectors:
        - type: directory
          value: packages/magix-cache-cli/src/Console/.*
    - name: CliSource
      collectors:
        - type: directory
          value: packages/magix-cache-cli/src/Source/.*
    - name: CliReader
      collectors:
        - type: directory
          value: packages/magix-cache-cli/src/Reader/.*
    - name: CliDeclaration
      collectors:
        - type: directory
          value: packages/magix-cache-cli/src/Declaration/.*
    - name: CliGraph
      collectors:
        - type: directory
          value: packages/magix-cache-cli/src/Graph/.*
    - name: CliRender
      collectors:
        - type: directory
          value: packages/magix-cache-cli/src/Render/.*
    - name: CliKey
      collectors:
        - type: directory
          value: packages/magix-cache-cli/src/Key/.*
  ruleset:
    CoreApi:
      - Composition
      - Metadata
      - Runtime
      - Cache
      - Clock
      - Strategy
    Attribute:
      - CoreApi
      - Metadata
      - Runtime
      - Strategy
    Composition:
      - CoreApi
      - Metadata
    Metadata: ~
    Strategy:
      - CoreApi
      - Metadata
    Runtime:
      - CoreApi
      - Attribute
      - Cache
      - Metadata
      - Strategy
    Cache:
      - Metadata
      - Clock
    Clock: ~
    Laravel:
      - CoreApi
      - Cache
      - Runtime
    Symfony:
      - CoreApi
      - Cache
      - Runtime
    CliConsole:
      - CliDeclaration
      - CliGraph
      - CliKey
      - CliRender
      - CliSource
    CliSource:
      - CliDeclaration
      - CliReader
    CliReader:
      - CliDeclaration
      - CoreApi
      - Attribute
      - Metadata
      - Runtime
      - Strategy
    CliDeclaration:
      - Metadata
      - Runtime
    CliGraph:
      - CliDeclaration
      - Metadata
      - Runtime
      - Strategy
    CliRender:
      - CliDeclaration
      - CliGraph
      - Metadata
      - Runtime
    CliKey:
      - Runtime
